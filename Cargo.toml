[package]
name        = "nucleo-g474re-button-led"
version     = "0.1.0"
edition     = "2024"
description = "Nucleo-G474RE: button-controlled LED in Rust (Embassy), written in the layered cooperative-scheduler style"

[dependencies]
cortex-m         = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7.7"
defmt            = "1.2.0"
defmt-rtt        = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32    = { version = "0.6.0",  features = ["defmt", "stm32g474re", "dual-bank", "time-driver-any", "memory-x"] }
embassy-time     = { version = "0.5.1",  features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe      = { version = "1.0.0",  features = ["print-defmt"] }

[profile.dev]
opt-level = "s"          # keep debug builds small enough and fast enough on target

[profile.release]
opt-level     = "s"
debug         = 2        # symbols stay in the ELF only, not in flash
lto           = "fat"
codegen-units = 1
